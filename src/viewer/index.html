<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoroSim viewer</title>
<style>
:root { --bg: #05060a; --panel: #0b0d14; --ink: #e9e7e1; --muted: #8d90a3; --rule: #2b2f45; --accent: #b8372e; --ok: #5fb37a; --warn: #e0a53c; --bad: #e0574c; }
:root[data-theme="light"] { --bg: #eeece6; --panel: #f7f5f0; --ink: #05060a; --muted: #5a5d6e; --rule: #c4c1b9; --ok: #2f7a4a; --warn: #9a6400; --bad: #b3261e; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; }
.root { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; padding: 10px; height: 620px; }
.root.full { height: 100vh; }
header { display: flex; align-items: center; gap: 10px; min-width: 0; }
header h1 { margin: 0; font: 700 12px/1 -apple-system, Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
#headline { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
header .sp { flex: 1; }
button { padding: 6px 9px; font: 700 11px/1 -apple-system, Arial, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); cursor: pointer; }
button:hover { background: var(--ink); color: var(--bg); }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.top { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(210px, 1fr); gap: 8px; min-height: 0; }
.stage { position: relative; min-height: 0; background: radial-gradient(ellipse at 50% 40%, #1b1e2c 0%, #07080d 75%); border: 1px solid var(--rule); }
:root[data-theme="light"] .stage { background: radial-gradient(ellipse at 50% 40%, #fbfaf6 0%, #d9d6ce 80%); }
.stage canvas { display: block; width: 100%; height: 100%; }
.views { position: absolute; left: 6px; bottom: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.views button { padding: 4px 6px; font-size: 10px; }
.legend { position: absolute; right: 8px; top: 6px; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 8px; vertical-align: -1px; }
.monitor { min-height: 0; overflow: auto; padding: 8px 10px; background: var(--panel); border: 1px solid var(--rule); }
.monitor table { width: 100%; border-collapse: collapse; }
.monitor td { padding: 3px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.monitor td:last-child { text-align: right; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
.monitor h2 { margin: 10px 0 4px; font: 700 11px/1 -apple-system, Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
.problems div { padding: 3px 0 3px 8px; margin: 3px 0; border-left: 3px solid var(--warn); }
.problems .bad { border-color: var(--bad); } .problems .ok { border-color: var(--ok); }
.steps div { margin: 3px 0; }
.ecgwrap { background: #fffaf8; border: 1px solid #e3b3ad; }
#ecg { display: block; width: 100%; }
.bad { color: var(--bad); } .warn { color: var(--warn); }
@media (max-width: 560px) { .top { grid-template-columns: 1fr; grid-template-rows: 260px auto; } .root { height: auto; } }
</style>
</head>
<body>
<div class="root" id="root">
  <header>
    <h1>CoroSim</h1><span id="headline">Waiting for a patient…</span><span class="sp"></span>
    <button id="open" title="Open this patient in the full CoroSim app">Open in CoroSim</button>
    <button id="full" hidden>Fullscreen</button>
  </header>
  <div class="top">
    <div class="stage" id="stage">
      <div class="legend"><i style="background:#7c2a24"></i>muscle<i style="background:#3f3150"></i>ischemic<i style="background:#2a2230"></i>infarct<i style="background:#f2c14e"></i>narrowing</div>
      <div class="views">
        <button data-view="anterior" class="on">Anterior</button><button data-view="left">Left</button><button data-view="posterior">Posterior</button><button data-view="inferior">Inferior</button><button data-view="right">Right</button>
      </div>
    </div>
    <div class="monitor">
      <table>
        <tr><td>Rhythm</td><td id="rhythm">…</td></tr>
        <tr><td>Heart rate</td><td id="hr">…</td></tr>
        <tr><td>Blood pressure</td><td id="bp">…</td></tr>
        <tr><td>Output</td><td id="co">…</td></tr>
        <tr><td>ST elevation</td><td id="stup">…</td></tr>
        <tr><td>ST depression</td><td id="stdown">…</td></tr>
        <tr><td>Ischemia</td><td id="isch">…</td></tr>
        <tr><td>LV infarct</td><td id="inf">…</td></tr>
      </table>
      <h2>Problems</h2><div class="problems" id="problems"></div>
      <h2>Guidelines next</h2><div class="steps" id="steps"></div>
    </div>
  </div>
  <div class="ecgwrap"><canvas id="ecg"></canvas></div>
</div>
<script type="module" src="./viewer.ts"></script>
</body>
</html>

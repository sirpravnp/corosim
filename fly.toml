# CoroSim MCP server on Fly.io, served as https://mcp.corosim.com
# First time: see docs/LLM_AND_MCP.md, "Hosting mcp.corosim.com". After that: fly deploy --ha=false
#
# One machine, asleep when unused: Fly stops it when no requests or open pages remain and starts it on the next
# request (a second or two). Nothing is lost while it sleeps: accounts, AI sign-ins and patients are in SQLite on
# the volume at /data (fly volumes create corosim_data --size 1 --region iad), and connectors hold no session.
# Keep it to one machine: an open page holds its line on one process. Scale up, not out.

app = "corosim-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  COROSIM_ALLOWED_ORIGINS = "https://corosim.com,https://www.corosim.com"
  COROSIM_APP_URL = "https://corosim.com"
  COROSIM_PUBLIC_URL = "https://mcp.corosim.com"
  COROSIM_DATA_DIR = "/data"
  COROSIM_TRUST_PROXY = "1"
  # Secrets, set with fly secrets set (never in this file): GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
  # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET

[mounts]
  source = "corosim_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"   # sleep when idle; an open page's line keeps it awake
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

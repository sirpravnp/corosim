<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon.png" />
<title>CoroSim PCI lab (playtest)</title>
<script>try{var t=localStorage.getItem("corosim-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="app" id="app">
<header id="shell-head"></header>
<main class="labplay">
  <section class="stage">
    <h1>PCI lab playtest</h1>
    <p class="hint">Keys: <kbd>W</kbd>/<kbd>S</kbd> advance and withdraw · <kbd>A</kbd>/<kbd>D</kbd> torque · hold for repeat</p>
    <canvas id="view" width="720" height="480" aria-label="Access and coronary path"></canvas>
    <p class="cap">Figure 1. Schematic centerline (patient frame); tip follows the active device.</p>
  </section>
  <aside class="rail">
    <div class="readout" id="readout"></div>
    <div class="actions" id="actions">
      <button type="button" id="setup" class="primary">Set up access and guide</button>
      <button type="button" id="skip">Skip to coronaries</button>
      <button type="button" id="wire">Load wire</button>
    </div>
    <ol id="log" class="log"></ol>
  </aside>
</main>
<footer id="shell-foot"></footer>
</div>
<script type="module" src="../../../src/cath/lab/play.ts"></script>
</body>
</html>

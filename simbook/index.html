<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon.png" />
<title>CoroSim Simbook</title>
<meta name="description" content="A chapter-based reader for preclinical cardiac physiology: the text, the model, then a few questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Doto:wght@400;800&display=swap">
</head>
<body>
<div class="app" id="app">
<header id="shell-head"></header>

<section class="sb-intro" id="sb-intro" aria-labelledby="intro-title">
  <figure class="sb-cover">
    <img src="/simbook-cover.png" width="816" height="1056" alt="SimBook, a hemodynamic simulation ebook by Praveen Parthasarathy. Streamlines of blood narrow through a stenosis above a pressure waveform.">
  </figure>
  <div class="sb-front">
    <h1 id="intro-title">SimBook</h1>
    <p class="sb-tag">Learn hemodynamics by controlling it</p>
    <h2 class="sb-contents">Contents</h2>
    <div id="sb-toc"></div>
    <div class="sb-begin">
      <a class="sb-go" id="sb-start" href="#why-blood">Start chapter 1</a>
    </div>
  </div>
</section>

<main class="sb-main">
  <nav class="library" aria-label="Chapters">
    <div id="list" class="list"></div>
    <p class="lib-foot">Educational lumped models only.</p>
  </nav>

  <section class="sb-room">
    <div class="titlebar">
      <h1 id="title">Simbook</h1>
      <p id="summary" class="sb-sub"></p>
    </div>
    <div id="sb-read"></div>
    <div id="sb-sims"></div>
    <div id="sb-questions"></div>
  </section>
</main>

<footer id="shell-foot"></footer>
</div>
<script type="module" src="../src/simbook/page.ts"></script>
</body>
</html>

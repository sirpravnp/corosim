<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon.png" />
<title>CoroSim Simbook</title>
<meta name="description" content="A chapter-based reader for preclinical cardiac physiology: predict, change one parameter, watch the physics, then read the tie-back.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
</head>
<body>
<div class="app" id="app">
<header id="shell-head"></header>

<main class="sb-main">
  <nav class="library" aria-label="Chapters">
    <div id="list" class="list"></div>
    <p class="lib-foot">Educational lumped models only — same disclaimer as the rest of CoroSim.</p>
  </nav>

  <section class="sb-room">
    <p class="sb-intro" id="intro"></p>
    <div class="titlebar">
      <h1 id="title">Simbook</h1>
      <p id="summary" class="summary"></p>
    </div>
    <div id="sb-step"></div>
    <div id="sb-widget-area" hidden>
      <div class="sb-widget">
        <div class="sb-screen"><canvas id="sb-canvas" width="640" height="380" aria-label="Chapter simulation"></canvas></div>
        <div class="sb-controls" id="sb-controls"></div>
        <div id="sb-readout"></div>
      </div>
    </div>
    <div class="sb-nav">
      <button type="button" id="sb-back">Back</button>
      <button type="button" id="sb-next" class="primary">Continue</button>
    </div>
  </section>
</main>

<footer id="shell-foot"></footer>
</div>
<script type="module" src="../src/simbook/page.ts"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="CoroSim anatomical heart logo">
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f05a6c"/>
      <stop offset="1" stop-color="#a51230"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0f1117"/>

  <!-- great vessels, each with a dark underlay so the tubes read as separate -->
  <g fill="none" stroke-linecap="butt">
    <!-- superior vena cava -->
    <path d="M78 110 L78 46" stroke="#0f1117" stroke-width="22"/>
    <path d="M78 110 L78 46" stroke="#5b7cff" stroke-width="16"/>
    <!-- aorta: ascends from the centre and arches to the viewer's right -->
    <path d="M152 110 C152 70 166 46 196 46 C214 46 222 58 222 70" stroke="#0f1117" stroke-width="30"/>
    <path d="M152 110 C152 70 166 46 196 46 C214 46 222 58 222 70" stroke="#e6334f" stroke-width="22"/>
    <!-- pulmonary trunk, crossing in front of the aortic root -->
    <path d="M118 112 C114 88 110 66 102 46" stroke="#0f1117" stroke-width="28"/>
    <path d="M118 112 C114 88 110 66 102 46" stroke="#c81e3f" stroke-width="20"/>
  </g>

  <!-- ventricular body, apex to the lower right -->
  <path d="M82 104 C54 122 52 172 92 200 C118 218 156 234 182 232 C194 220 218 176 214 124 C211 94 190 78 162 82 C148 84 136 92 126 102 C116 92 98 88 82 104 Z" fill="url(#body)"/>

  <!-- coronary arteries -->
  <g fill="none" stroke="#ffe3e8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- left main → LAD down the anterior interventricular groove to the apex -->
    <path d="M150 104 C138 112 128 134 128 156 C128 180 146 206 172 224"/>
    <!-- diagonals -->
    <path d="M131 132 C148 136 160 146 170 160"/>
    <path d="M131 164 C148 170 160 182 168 196"/>
    <!-- circumflex wrapping left -->
    <path d="M150 104 C168 106 186 116 198 132"/>
    <!-- RCA in the right AV groove with an acute marginal -->
    <path d="M110 112 C92 122 78 140 74 164 C72 180 82 196 100 208"/>
    <path d="M78 154 C96 156 110 166 118 180"/>
  </g>
</svg>

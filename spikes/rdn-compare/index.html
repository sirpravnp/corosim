<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RDN fluoro compare (spike)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0d14;
      color: #f4f1ea;
      font: 15px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid #2b2f45;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
    }
    h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .note { color: #98a0b8; font-size: 13px; max-width: 52ch; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 120px); }
    @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
    .col { border-right: 1px solid #2b2f45; display: flex; flex-direction: column; }
    .col:last-child { border-right: none; }
    .tag {
      padding: 10px 16px;
      border-bottom: 1px solid #2b2f45;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #98a0b8;
    }
    .stage { position: relative; flex: 1; min-height: 360px; background: #000; }
    .stage img.plate {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }
    .controls {
      padding: 12px 16px;
      border-top: 1px solid #2b2f45;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      background: transparent;
      border: 1px solid #2b2f45;
      color: #f4f1ea;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 2px;
    }
    button.primary { background: #b8372e; border-color: #b8372e; color: #fff; }
    button[aria-pressed="true"] { outline: 1px solid #e0a447; }
    label { font-size: 13px; color: #98a0b8; display: flex; align-items: center; gap: 8px; }
    input[type="range"] { width: 100px; }
    .dwell { flex: 1; min-width: 120px; height: 6px; background: #2b2f45; position: relative; max-width: 200px; }
    .dwell i { display: block; height: 100%; background: #e0a447; width: 0%; transition: width 0.05s linear; }
  </style>
</head>
<body>
  <header>
    <h1>RDN fluoroscopy spike</h1>
    <span class="note">Educational mockup only. Left: AI plate + calibrated overlays. Right: same state, procedural 2D (cath-style). Shared controls.</span>
  </header>
  <div class="cols">
    <div class="col">
      <div class="tag">Plate + masks</div>
      <div class="stage" id="plateStage">
        <img class="plate" src="mockup.jpg" alt="" id="plateImg" />
        <canvas id="plateCanvas"></canvas>
      </div>
    </div>
    <div class="col">
      <div class="tag">Procedural 2D</div>
      <div class="stage" id="procStage">
        <canvas id="procCanvas"></canvas>
      </div>
    </div>
  </div>
  <div class="controls" id="shared">
    <button type="button" id="btnInject">Inject L renal</button>
    <button type="button" id="btnAdvance">Advance wire</button>
    <button type="button" class="primary" id="btnEnergy" aria-pressed="false">RF energy</button>
    <label>LAO <input type="range" id="rot" min="-30" max="30" value="28" /> <span id="rotVal">28</span>°</label>
    <span>Dwell</span>
    <motion class="dwell"><i id="dwellBar"></i></motion>
    <label style="margin-left:auto">MAP stub <strong id="mapVal">158</strong> mmHg</label>
  </div>
  <script>
    // Shared procedure state (mm along centerline, 0..1 coverage)
    const state = {
      tipU: 0.15,
      contrast: 0,
      injectT0: -1e9,
      energy: false,
      dwell: 0,
      coverage: new Float32Array(64),
      rot: 28,
    };
    const DWELL_NEED = 8;

    // Plate calibration: normalized 0..1 image coords for renal tree (hand-tuned to mockup.jpg)
    const PLATE = {
      aorta: [[0.48, 0.32], [0.50, 0.42], [0.52, 0.52]],
      renalL: [[0.52, 0.52], [0.38, 0.54], [0.28, 0.56], [0.22, 0.58]],
      renalR: [[0.52, 0.52], [0.62, 0.54], [0.72, 0.56]],
      access: [[0.82, 0.92], [0.70, 0.78], [0.58, 0.62], [0.52, 0.52]],
    };

    // Procedural graph in fake mm (projected like angio.ts)
    const GRAPH = {
      centre: [0, 0, 0],
      segs: [
        { id: "AO", samples: [[0, 0, 0], [0, -20, 0], [0, -40, 0]], d: [8, 7, 6] },
        { id: "RL", samples: [[0, -40, 0], [-25, -42, 0], [-45, -44, 0]], d: [5, 4.5, 4] },
        { id: "RR", samples: [[0, -40, 0], [25, -42, 0], [45, -44, 0]], d: [5, 4.5, 4] },
      ],
    };

    function project(p, ry, rx) {
      const cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
      const x = p[0] * cy + p[2] * sy;
      const z = -p[0] * sy + p[2] * cy;
      const y = p[1];
      return [x, y * cx - z * sx, y * sx + z * cx];
    }

    function resizeCanvas(canvas, stage) {
      const r = stage.getBoundingClientRect();
      const dpr = Math.min(2, devicePixelRatio || 1);
      canvas.width = Math.floor(r.width * dpr);
      canvas.height = Math.floor(r.height * dpr);
    }

    const plateCanvas = document.getElementById("plateCanvas");
    const procCanvas = document.getElementById("procCanvas");
    const plateStage = document.getElementById("plateStage");
    const procStage = document.getElementById("procStage");

    function lerpPath(path, u) {
      const n = path.length - 1;
      const f = u * n;
      const i = Math.min(n - 1, Math.floor(f));
      const t = f - i;
      const a = path[i], b = path[i + 1];
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    }

    function drawPlate(now) {
      resizeCanvas(plateCanvas, plateStage);
      const ctx = plateCanvas.getContext("2d");
      const W = plateCanvas.width, H = plateCanvas.height;
      ctx.clearRect(0, 0, W, H);

      const t = state.injectT0 > 0 ? (now - state.injectT0) / 1000 : -1;
      const fade = t < 0 ? 0 : t < 0.3 ? t / 0.3 : t < 4 ? 1 : Math.max(0, 1 - (t - 4) / 2);

      const drawVessel = (path, lit) => {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (let i = 0; i < path.length - 1; i++) {
          const [x0, y0] = path[i], [x1, y1] = path[i + 1];
          const px0 = x0 * W, py0 = y0 * H, px1 = x1 * W, py1 = y1 * H;
          const w = 4 + lit * 10;
          ctx.strokeStyle = `rgba(255,255,255,${0.15 + lit * fade * 0.75})`;
          ctx.lineWidth = w;
          ctx.beginPath();
          ctx.moveTo(px0, py0);
          ctx.lineTo(px1, py1);
          ctx.stroke();
        }
      };

      drawVessel(PLATE.aorta, 0.2);
      drawVessel(PLATE.renalR, 0.1);
      drawVessel(PLATE.renalL, fade);

      // catheter along access + left renal to tip
      const cathPts = [...PLATE.access];
      const tip = lerpPath(PLATE.renalL, state.tipU);
      cathPts.push(tip);
      ctx.strokeStyle = "rgba(255,255,240,0.55)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      cathPts.forEach((p, i) => {
        const x = p[0] * W, y = p[1] * H;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // ablation dots on left renal
      for (let i = 0; i < state.coverage.length; i++) {
        const c = state.coverage[i];
        if (c < 0.05) continue;
        const u = 0.2 + (i / state.coverage.length) * 0.75;
        const [x, y] = lerpPath(PLATE.renalL, u);
        ctx.fillStyle = `rgba(224,164,71,${0.4 + c * 0.6})`;
        ctx.beginPath();
        ctx.arc(x * W, y * H, 4 + c * 4, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "rgba(220,220,210,0.85)";
      ctx.font = `${Math.round(12 * devicePixelRatio)}px monospace`;
      ctx.fillText(`LAO ${state.rot}°  t ${Math.max(0, t).toFixed(1)}s`, 14, 22);
    }

    function drawProc(now) {
      resizeCanvas(procCanvas, procStage);
      const ctx = procCanvas.getContext("2d");
      const W = procCanvas.width, H = procCanvas.height;
      const ry = (state.rot * Math.PI) / 180;
      const rx = 0;
      const sc = W / 135;
      const cx0 = W / 2, cy0 = H / 2 + 20;

      // background blob (minimal angio mimic)
      const img = ctx.createImageData(W, H);
      for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
        const X = (i - W / 2) / W, Y = (j - H / 2) / H;
        let b = 0.42 + 0.08 * Math.exp(-((X) ** 2 + (Y + 0.1) ** 2) / 0.08);
        const k = (j * W + i) * 4;
        const v = Math.max(0, Math.min(255, b * 255));
        img.data[k] = img.data[k + 1] = img.data[k + 2] = v;
        img.data[k + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);

      const t = state.injectT0 > 0 ? (now - state.injectT0) / 1000 : -1;
      const fade = t < 0 ? 0 : t < 0.3 ? t / 0.3 : t < 4 ? 1 : Math.max(0, 1 - (t - 4) / 2);

      const drawSeg = (seg, lit) => {
        for (let i = 0; i < seg.samples.length - 1; i++) {
          const a = project(seg.samples[i], ry, rx);
          const b = project(seg.samples[i + 1], ry, rx);
          const x0 = cx0 + a[0] * sc, y0 = cy0 - a[1] * sc;
          const x1 = cx0 + b[0] * sc, y1 = cy0 - b[1] * sc;
          const rad = Math.max(2, seg.d[i] * sc * 0.5);
          const g = ctx.createRadialGradient(x0, y0, 0, x0, y0, rad);
          const al = lit * fade * 0.7;
          g.addColorStop(0, `rgba(255,255,255,${al})`);
          g.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x0, y0, rad, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = `rgba(255,255,255,${al * 0.3})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(x1, y1);
          ctx.stroke();
        }
      };
      drawSeg(GRAPH.segs[0], 0.3);
      drawSeg(GRAPH.segs[2], 0.15);
      drawSeg(GRAPH.segs[1], fade);

      // fake catheter
      const rl = GRAPH.segs[1];
      const idx = Math.floor(state.tipU * (rl.samples.length - 1));
      const tip = project(rl.samples[idx], ry, rx);
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cx0 + 60, cy0 + 120);
      ctx.bezierCurveTo(cx0 + 20, cy0 + 80, cx0, cy0 + 40, cx0 + tip[0] * sc, cy0 - tip[1] * sc);
      ctx.stroke();

      ctx.fillStyle = "rgba(220,220,210,0.85)";
      ctx.font = `${Math.round(12 * devicePixelRatio)}px monospace`;
      ctx.fillText(`LAO ${state.rot}°  procedural`, 14, 22);
    }

    function tick(dt, now) {
      if (state.energy && state.tipU > 0.35) {
        state.dwell += dt / 1000;
        const i = Math.min(63, Math.floor(state.tipU * 63));
        state.coverage[i] = Math.min(1, state.coverage[i] + dt / (DWELL_NEED * 1000));
      } else {
        state.dwell = Math.max(0, state.dwell - dt / 500);
      }
      document.getElementById("dwellBar").style.width = `${(state.dwell / DWELL_NEED) * 100}%`;
      const cov = state.coverage.reduce((a, b) => a + b, 0) / state.coverage.length;
      document.getElementById("mapVal").textContent = String(Math.round(158 - cov * 12));
    }

    let last = performance.now();
    function frame(now) {
      tick(now - last, now);
      last = now;
      drawPlate(now);
      drawProc(now);
      requestAnimationFrame(frame);
    }

    document.getElementById("btnInject").onclick = () => { state.injectT0 = performance.now(); };
    document.getElementById("btnAdvance").onclick = () => { state.tipU = Math.min(0.95, state.tipU + 0.12); };
    document.getElementById("btnEnergy").onclick = (e) => {
      state.energy = !state.energy;
      e.target.setAttribute("aria-pressed", state.energy ? "true" : "false");
    };
    document.getElementById("rot").oninput = (e) => {
      state.rot = +e.target.value;
      document.getElementById("rotVal").textContent = state.rot;
      document.getElementById("plateImg").style.filter = `contrast(${1 + Math.abs(state.rot) * 0.01})`;
    };

    window.addEventListener("resize", () => { drawPlate(performance.now()); drawProc(performance.now()); });
    requestAnimationFrame(frame);
  </script>
</body>
</html>

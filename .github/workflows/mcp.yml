name: Deploy MCP server to Fly.io

# Runs when the server or the simulation it serves changes. Needs the repository secret FLY_API_TOKEN
# (fly tokens create deploy); without it the job only tests, so forks and a not-yet-set-up repo stay green.
on:
  push:
    branches: [main]
    paths: ["src/**", "Dockerfile", "fly.toml", "package.json", "package-lock.json", ".github/workflows/mcp.yml"]
  workflow_dispatch:

concurrency:
  group: mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:fast
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --remote-only --ha=false
        if: env.FLY_API_TOKEN != ''
      - name: Check the live server answers
        if: env.FLY_API_TOKEN != ''
        run: curl --fail --retry 5 --retry-delay 5 https://mcp.corosim.com/health
